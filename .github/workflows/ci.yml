name: CI

on:
    push:
    pull_request:

jobs:
    integration-test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: go-photo
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Go
              uses: actions/setup-go@v2
              with:
                  go-version: "1.24.1"

            - name: Install dependencies
              run: |
                  go mod download
                  make install-deps

            - name: Copy .env.example to .env
              run: cp .env.example .env

            - name: Run migrations
              run: |
                  docker run --rm \
                    --network host \
                    -v ${{ github.workspace }}/migrations:/migrations \
                    migrate/migrate \
                    -path=/migrations \
                    -database "postgres://postgres:postgres@localhost:5432/go-photo?sslmode=disable" \
                    up

            - name: Install dependencies
              run: |
                  go mod download
                  make install-deps

            - name: Generate
              run: |
                  make generate

            - name: Run go
              run: |
                  go run cmd/http_server/main.go

            - name: Run integration tests
              run: make integration-test

    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Go
              uses: actions/setup-go@v2
              with:
                  go-version: "1.24.1"

            - name: Update PATH
              run: echo "${{ runner.workspace }}/bin" >> $GITHUB_PATH

            - name: Install dependencies
              run: |
                  go mod download
                  make install-deps

            - name: Docs generation
              run: |
                  make generate-docs

            - name: Build tests
              run: make tests-build

            - name: Run tests
              run: make run-tests

            - name: Collect test coverage
              run: make collect-coverage-ci

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: |
                      coverage.out

    upload-coverage:
        needs: unit-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Download coverage artifact
              uses: actions/download-artifact@v4
              with:
                  name: coverage-report

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
