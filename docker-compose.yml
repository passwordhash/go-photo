version: "3.9"

services:
    postgres:
        image: postgres:15
        container_name: go-photo-db
        restart: always
        ports:
            - "${POSTGRES_PORT}:5432"
        networks:
            - shared-net
        environment:
            POSTGRES_PORT: ${POSTGRES_PORT}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - db_data:/var/lib/postgresql/data

    migrate:
        image: migrate/migrate
        container_name: go-photo-migrate
        entrypoint:
            [
                "sh",
                "-c",
                "sleep 5 && migrate -path /migrations -database postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable up",
            ]
        depends_on:
            - postgres
        volumes:
            - ./schema:/migrations

    app:
        container_name: go-photo-app
        env_file: .env
        networks:
            - shared-net
        depends_on:
            - postgres
            - migrate
        ports:
            - ${HTTP_PORT}:${HTTP_PORT}
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - app_storage:/app/storage

volumes:
    db_data:
    app_storage:

networks:
    shared-net:
        external: true
